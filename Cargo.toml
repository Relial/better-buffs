[package]
name = "better-buffs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.103"
ilhook = { version = "2.3.0", default-features = false, features = ["x86"] }
bunny-plugin = { git = "https://github.com/Relial/bunny-plugin.git", tag = "api-v3" }
bunny-components = { git = "https://github.com/Relial/bunny-components.git", rev = "c27acde41d3d53cd53a929354457f56ee8ed8e11" }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive"] }
windows = { version = "0.*", features = [
    "Win32_Foundation",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
] }
toml = "1.1.2"
postcard = { version = "1.1.3", features = ["alloc"] }
strum = { version = "0.28.0", features = ["derive"] }

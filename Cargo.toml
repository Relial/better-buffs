[package]
name = "better-guild-poogie"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.103"
ilhook = { version = "2.3.0", default-features = false, features = ["x86"] }
bunny-plugin = { git = "https://github.com/Relial/bunny-plugin.git", tag = "api-v2", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.228", features = ["derive"] }
windows = { version = "0.*", features = [
    "Win32_Foundation",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
] }
postcard = { version = "1.1.3", features = ["alloc"] }
